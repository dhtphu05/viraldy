name: Backend Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: viraldy
          POSTGRES_PASSWORD: viraldy
          POSTGRES_DB: viraldy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U viraldy -d viraldy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://viraldy:viraldy@localhost:5432/viraldy
      DATABASE_SYNC_URL: postgresql+psycopg://viraldy:viraldy@localhost:5432/viraldy
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      S3_BUCKET: viraldy-local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
        working-directory: apps/backend
      - run: uv run ruff check .
        working-directory: apps/backend
      - run: uv run ruff format --check .
        working-directory: apps/backend
      - run: uv run mypy src
        working-directory: apps/backend
      - run: uv run alembic upgrade head
        working-directory: apps/backend
      - run: uv run pytest
        working-directory: apps/backend
