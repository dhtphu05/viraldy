[project]
name = "viraldy-backend"
version = "0.1.0"
description = "Viraldy backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "boto3==1.35.92",
  "celery[redis]==5.4.0",
  "fastapi==0.139.0",
  "gunicorn==23.0.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
  "psycopg[binary]==3.2.3",
  "pydantic[email]==2.10.4",
  "pydantic-settings==2.7.1",
  "pyjwt[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "redis==5.2.1",
  "sentry-sdk==2.19.2",
  "sqlalchemy[asyncio]==2.0.36",
  "structlog==24.4.0",
  "uvicorn[standard]==0.51.0",
  "pytest>=8.3.4",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.0",
  "mypy==1.14.1",
  "pip-audit==2.7.3",
  "pre-commit==4.0.1",
  "ruff==0.8.4",
]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.0.0",
  "testcontainers[minio,postgres,redis]==4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viraldy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "celery", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=viraldy --cov-report=term-missing --cov-fail-under=70"
